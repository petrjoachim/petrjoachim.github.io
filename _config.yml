# Site settings. Restart `bundle exec jekyll serve` after editing this file.

title: Petr Joachim
tagline: Engineering Leadership Coach & Fractional CTO
description: >-
  Engineering Leadership Coach & Fractional CTO. Former CTO and VP of
  Engineering, coaching tech leaders since 2019.
url: https://petr.joachim.cz
baseurl: ""
lang: en

author:
  name: Petr Joachim
  email: petr@joachim.cz
  linkedin: https://www.linkedin.com/in/petrjoachim/ # TODO: confirm profile URL
  location: Brno, Czech Republic
  # Portrait used on the homepage and About page, e.g. /assets/img/petr.jpg
  # (with a .webp next to it). Leave empty to hide the photo.
  photo: ""
  photo_width: 800
  photo_height: 1000

# Business details for the footer (Czech Civil Code §435).
business:
  name: Petr Joachim
  place: "" # TODO: place of business, e.g. "Brno"
  ico: "" # TODO: IČO

# Booking tool. Every CTA links to /contact/; only that page uses this value.
booking:
  cal_link: "" # TODO: Cal.com "username/event-slug", e.g. "petrjoachim/intro"

# SEO: shared Open Graph image and card type for LinkedIn/X previews.
twitter:
  card: summary_large_image

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/og-image.png
        width: 1200
        height: 630
        alt: "Petr Joachim, Engineering Leadership Coach & Fractional CTO"
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /writing/:title/

# Feature flags
writing:
  enabled: false
analytics:
  enabled: false
  provider: goatcounter
  goatcounter_code: "" # TODO(step 4)
offers:
  show_prices: false

# Build
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - .editorconfig
  - .ruby-version
  - Gemfile
  - Gemfile.lock
  - README.md
  - SPEC.md
  - vendor/
