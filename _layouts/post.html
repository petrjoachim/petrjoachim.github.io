---
layout: default
---
<article class="post">
  <header class="section page-header">
    <div class="container">
      <p class="timeline__meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
        · {% include reading-time.html content=content %}
      </p>
      <h1>{{ page.title }}</h1>
      {%- if page.description %}
      <p class="lead">{{ page.description }}</p>
      {%- endif %}
    </div>
  </header>
  <div class="container prose">
    {{ content }}
    <p><a class="link-arrow" href="{{ '/writing/' | relative_url }}">All articles</a></p>
  </div>
</article>
{% include cta.html variant="block" %}
