---
layout: default
---
<article class="page">
  <header class="section page-header">
    <div class="container">
      <h1>{{ page.title }}</h1>
      {%- if page.lead %}
      <p class="lead">{{ page.lead }}</p>
      {%- endif %}
    </div>
  </header>
  <div class="container prose">
    {{ content }}
  </div>
</article>
{%- unless page.hide_cta %}
{% include cta.html variant="block" %}
{%- endunless %}
