# Coaching page FAQ.
# TODO: draft answers. Check each one against your real terms.
- question: Is what we discuss confidential?
  answer: >-
    Yes. Nothing from our sessions is shared with anyone, including your
    employer when they pay for the coaching. If the company wants to know
    how it is going, we agree together what you report back.

- question: Can my company pay for the coaching?
  answer: >-
    Yes, most clients have their employer pay. I can send a short proposal
    for your manager or HR, and we agree the goals with you first.

- question: How does invoicing work?
  answer: >-
    I invoice the whole package up front, either to you or to your
    company, in euros or Czech crowns.

- question: What if I need to cancel a session?
  answer: >-
    Let me know at least 24 hours before and we move the session to
    another time. Later cancellations count as a used session.

- question: Remote or in person?
  answer: >-
    Most sessions are remote over video. In person works in Brno and
    Prague. Sessions are in English, Czech or Slovak.

- question: How is coaching different from mentoring?
  answer: >-
    A mentor mostly shares their own experience. In coaching you work
    out your own answers, and I bring structure, questions and, when it
    helps, my experience as a CTO and VP of Engineering.
