<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <ul class="site-nav__list">
        {%- for item in site.data.navigation.main %}
          {%- if item.requires and site[item.requires].enabled != true %}{% continue %}{% endif %}
          <li>
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
          </li>
        {%- endfor %}
      </ul>
    </nav>
    {% include cta.html label=site.data.navigation.cta_label size="small" %}
    <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false">
      <span class="visually-hidden">Menu</span>
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
    </button>
  </div>
</header>
